# No explicit `name:` here on purpose. This stack keeps the default project
# name (the folder name, `logger`) so existing checkouts keep their
# `logger_postgres_data` volume — naming it now would silently point every
# developer at a new, empty database. The production compose file declares
# `name: logger-prod` instead, which is what keeps the two from colliding.

services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    # Mirrors the production command (docker-compose.yml) so a setting can be
    # tried here before it is tried there. Values are upstream defaults;
    # pg_stat_statements is enabled because it needs a restart to turn on and
    # costs effectively nothing to leave on.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
