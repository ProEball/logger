# No explicit `name:` here on purpose. This stack keeps the default project
# name (the folder name, `logger`) so existing checkouts keep their
# `logger_postgres_data` volume — naming it now would silently point every
# developer at a new, empty database. The production compose file declares
# `name: logger-prod` instead, which is what keeps the two from colliding.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # Mirrors the production command (docker-compose.yml) so a setting can be
    # tried here before it is tried there. Values are upstream defaults;
    # pg_stat_statements is enabled because it needs a restart to turn on and
    # costs effectively nothing to leave on.
    #
    # It said "mirrors" from 2026-08-20 while exposing two of the five knobs
    # production had; the missing three were added on 2026-08-24 along with the
    # rest. `db/postgres-tuning.test.mjs` now asserts the two files expose the
    # same set, so the claim is checked rather than trusted.
    #
    # A developer machine cannot validate a *value* here — its page cache holds
    # the whole working set, so every shared_buffers setting measures the same.
    # What it validates is that the flag parses and Postgres still boots.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-4.0}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-1}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      - -c
      - jit=${PG_JIT:-on}
      - -c
      - track_io_timing=${PG_TRACK_IO_TIMING:-off}
      - -c
      - log_temp_files=${PG_LOG_TEMP_FILES:--1}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  # The events store (docs/features/09-clickhouse.md). Distinct from the Phase 0
  # lab in lab/clickhouse/, which keeps its own compose file, project name and
  # volume: that one is a throwaway measurement rig, this one is the dev
  # database. Both bind 8123, so only one runs at a time.
  clickhouse:
    # Pinned to the minor version the schema was measured against. The JSON
    # type is the newest construct in it and its behaviour is version-dependent
    # — §14.3.2 found the binding limit to be memory per path rather than the
    # documented max_dynamic_paths, and that number belongs to this version.
    image: clickhouse/clickhouse-server:25.3
    restart: unless-stopped
    ports:
      - "8123:8123" # HTTP — what @clickhouse/client talks to
      - "9000:9000" # native, for a clickhouse-client shell
    # ClickHouse opens a file per column per part; the stock container limit is
    # far below what a MergeTree table needs during a merge.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: logger
      CLICKHOUSE_USER: logger
      CLICKHOUSE_PASSWORD: logger
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # Mirrors the production knobs so a value can be tried here before it is
      # tried there. Unset means ClickHouse's own defaults — a developer machine
      # cannot validate a memory *value* anyway, only that the server boots with
      # it. Same reasoning as the postgres command line above.
      CLICKHOUSE_MAX_SERVER_MEMORY: ${CLICKHOUSE_MAX_SERVER_MEMORY:-0}
      CLICKHOUSE_MARK_CACHE_SIZE: ${CLICKHOUSE_MARK_CACHE_SIZE:-5368709120}
      CLICKHOUSE_LOG_LEVEL: ${CLICKHOUSE_LOG_LEVEL:-warning}
    volumes:
      # A file, not the directory — see the header of logger.xml.
      - ./db/clickhouse/config.d/logger.xml:/etc/clickhouse-server/config.d/logger.xml:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  clickhouse_data:
