<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-base); margin: 0; padding: 14px; font-family: var(--font-sans); }
  .filter-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 10px; background: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: 6px; }

  .search-wrap { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; background: var(--bg-overlay); border: 1px solid var(--border-default); border-radius: 4px; min-width: 180px; }
  .search-wrap svg { color: var(--text-muted); flex-shrink: 0; }
  .search-text { font-size: 12px; color: var(--text-muted); font-family: var(--font-sans); }

  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 4px; font-size: 12px; font-weight: 500; border: 1px solid var(--border-default); color: var(--text-secondary); background: var(--bg-overlay); cursor: default; white-space: nowrap; }
  .chip-key { color: var(--text-muted); font-size: 11px; }
  .chip-val { color: var(--text-primary); }
  .chip-remove { display: inline-flex; align-items: center; justify-content: center; width: 13px; height: 13px; border-radius: 2px; color: var(--text-muted); cursor: pointer; margin-left: 1px; }
  .chip-remove:hover { background: var(--surface-active); color: var(--text-primary); }

  .divider { width: 1px; height: 20px; background: var(--border-subtle); flex-shrink: 0; }

  .add-filter-btn { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px; background: transparent; border: 1px dashed var(--border-default); border-radius: 4px; font-size: 12px; color: var(--text-muted); cursor: pointer; font-family: var(--font-sans); white-space: nowrap; }
  .add-filter-btn:hover { border-color: var(--border-strong); color: var(--text-secondary); background: var(--surface-hover); }

  .time-btn { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; background: var(--bg-overlay); border: 1px solid var(--border-default); border-radius: 4px; font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; margin-left: auto; white-space: nowrap; }
  .time-btn:hover { border-color: var(--border-strong); color: var(--text-primary); }

  .count-label { font-size: 11px; color: var(--text-muted); margin-left: 2px; white-space: nowrap; }

  /* Dropdown preview */
  .dropdown { background: var(--bg-overlay); border: 1px solid var(--border-default); border-radius: 6px; box-shadow: var(--shadow-2); width: 200px; margin-top: 10px; overflow: hidden; }
  .dropdown-header { padding: 8px 10px; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid var(--border-subtle); }
  .dropdown-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 13px; color: var(--text-primary); cursor: pointer; }
  .dropdown-item:hover { background: var(--surface-hover); }
  .dropdown-item .item-icon { color: var(--text-muted); }
</style>
</head>
<body>

<div class="filter-bar">
  <div class="search-wrap">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span class="search-text">Search events…</span>
  </div>

  <div class="divider"></div>

  <span class="chip">
    <span class="chip-key">level:</span>
    <span class="chip-val">error, fatal</span>
    <span class="chip-remove"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
  </span>
  <span class="chip">
    <span class="chip-key">env:</span>
    <span class="chip-val">prod</span>
    <span class="chip-remove"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
  </span>
  <span class="chip">
    <span class="chip-key">message~</span>
    <span class="chip-val">"timeout"</span>
    <span class="chip-remove"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
  </span>

  <button class="add-filter-btn">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add filter
  </button>

  <span class="count-label">1,482 events</span>

  <div class="time-btn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    Last 1h
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
</div>

<div class="dropdown">
  <div class="dropdown-header">Filter by</div>
  <div class="dropdown-item">
    <span class="item-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg></span>
    Level
  </div>
  <div class="dropdown-item">
    <span class="item-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
    Environment
  </div>
  <div class="dropdown-item">
    <span class="item-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
    Message contains
  </div>
  <div class="dropdown-item">
    <span class="item-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
    Source
  </div>
  <div class="dropdown-item">
    <span class="item-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z"/><path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/><path d="M9.5 14c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S8 21.33 8 20.5v-5c0-.83.67-1.5 1.5-1.5z"/><path d="M3.5 14H5v1.5c0 .83-.67 1.5-1.5 1.5S2 16.33 2 15.5 2.67 14 3.5 14z"/><path d="M14 14.5c0-.83.67-1.5 1.5-1.5h5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-5c-.83 0-1.5-.67-1.5-1.5z"/><path d="M15.5 19H14v1.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5-.67-1.5-1.5-1.5z"/><path d="M10 9.5C10 8.67 9.33 8 8.5 8h-5C2.67 8 2 8.67 2 9.5S2.67 11 3.5 11h5c.83 0 1.5-.67 1.5-1.5z"/><path d="M8.5 5H10V3.5C10 2.67 9.33 2 8.5 2S7 2.67 7 3.5 7.67 5 8.5 5z"/></svg></span>
    Attribute
  </div>
</div>

</body>
</html>
