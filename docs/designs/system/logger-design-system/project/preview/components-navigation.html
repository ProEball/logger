<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--bg-base); margin: 0; padding: 14px; font-family: var(--font-sans); }
  .section-title { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 10px; }
  .section { margin-bottom: 20px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }

  /* Sidebar strip */
  .sidebar { width: 160px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 6px; padding: 8px 0; flex-shrink: 0; }
  .nav-section-label { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase; padding: 8px 12px 4px; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 13px; color: var(--text-secondary); cursor: pointer; border-radius: 0; }
  .nav-item:hover { background: var(--surface-hover); color: var(--text-primary); }
  .nav-item.active { background: var(--accent-subtle); color: var(--accent-text); border-right: 2px solid var(--accent); }
  .nav-item svg { flex-shrink: 0; }
  .nav-divider { height: 1px; background: var(--border-subtle); margin: 6px 0; }

  /* Tabs */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border-subtle); }
  .tab { display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 13px; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 500; }
  .tab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 16px; padding: 0 4px; background: var(--bg-overlay); border-radius: 3px; font-size: 10px; font-weight: 600; color: var(--text-muted); }
  .tab.active .tab-count { background: var(--accent-subtle); color: var(--accent-text); }

  /* Breadcrumbs */
  .breadcrumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .bc-item { font-size: 12px; color: var(--text-muted); cursor: pointer; }
  .bc-item:hover { color: var(--text-primary); }
  .bc-item.current { color: var(--text-primary); font-weight: 500; cursor: default; }
  .bc-sep { color: var(--text-muted); font-size: 10px; }

  /* Pagination */
  .pagination { display: flex; align-items: center; gap: 4px; }
  .page-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 4px; border: 1px solid transparent; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
  .page-btn:hover { background: var(--surface-hover); border-color: var(--border-default); color: var(--text-primary); }
  .page-btn.active { background: var(--accent-subtle); border-color: var(--accent-border); color: var(--accent-text); font-weight: 500; }
  .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .page-info { font-size: 12px; color: var(--text-muted); margin: 0 4px; }
</style>
</head>
<body>

<div class="section">
  <div class="section-title">Sidebar Nav</div>
  <div class="row">
    <div class="sidebar">
      <div class="nav-section-label">Projects</div>
      <div class="nav-item active">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        api-gateway
      </div>
      <div class="nav-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        auth-service
      </div>
      <div class="nav-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        worker-pool
      </div>
      <div class="nav-divider"></div>
      <div class="nav-section-label">Org</div>
      <div class="nav-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </div>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; gap:14px;">
      <div>
        <div class="section-title">Tabs (underline, dense)</div>
        <div class="tabs">
          <div class="tab active">Events <span class="tab-count">1,482</span></div>
          <div class="tab">Dashboard</div>
          <div class="tab">Alerts <span class="tab-count">3</span></div>
          <div class="tab">Settings</div>
        </div>
      </div>

      <div>
        <div class="section-title">Breadcrumbs</div>
        <div class="breadcrumbs">
          <span class="bc-item">acme-org</span>
          <span class="bc-sep">›</span>
          <span class="bc-item">api-gateway</span>
          <span class="bc-sep">›</span>
          <span class="bc-item current">Events</span>
        </div>
      </div>

      <div>
        <div class="section-title">Pagination</div>
        <div class="pagination">
          <button class="page-btn" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button class="page-btn active">1</button>
          <button class="page-btn">2</button>
          <button class="page-btn">3</button>
          <span class="page-info">…</span>
          <button class="page-btn">24</button>
          <button class="page-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <span class="page-info">Page 1 of 24</span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
